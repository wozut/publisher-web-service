<!DOCTYPE html>
<html>
<head>
    <title>Collaborative Document Editor</title>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.2.0/bundles/stomp.umd.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            margin-bottom: 20px;
        }
        .row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .col {
            flex: 1;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, textarea, select {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        textarea {
            height: 400px;
            font-family: monospace;
            resize: vertical;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        button.secondary {
            background-color: #6c757d;
        }
        button.danger {
            background-color: #dc3545;
        }
        .status {
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .status.connected {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.disconnected {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .panel {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #dee2e6;
            margin-bottom: 15px;
        }
        .collaborator {
            padding: 5px;
            margin: 2px 0;
            background-color: #e9ecef;
            border-radius: 3px;
            font-size: 12px;
        }
        .messages {
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
            border: 1px solid #dee2e6;
        }
        .session-info {
            font-size: 12px;
            color: #6c757d;
        }
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 10px;
        }
        .cursor-position {
            background-color: #fff3cd;
            padding: 5px;
            border-radius: 3px;
            font-size: 12px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <h1>Collaborative Document Editor</h1>

    <div id="status" class="status disconnected">Disconnected</div>

    <div class="row">
        <div class="col">
            <div class="container">
                <label for="userId">User ID:</label>
                <input type="text" id="userId" value="0fc5d24f-90ac-47df-8fe1-b3477d82e709">
            </div>

            <div class="container">
                <label for="documentId">Document ID:</label>
                <input type="text" id="documentId" value="ed973e41-d119-4eb4-8207-bca742bbcc43">
            </div>

            <div class="container">
                <button id="connectBtn" onclick="connect()">Connect</button>
                <button id="disconnectBtn" onclick="disconnect()" disabled>Disconnect</button>
                <button id="joinBtn" onclick="joinDocument()" disabled>Join Document</button>
            </div>
        </div>

        <div class="col">
            <div class="panel">
                <h4>Session State</h4>
                <div id="sessionInfo" class="session-info">Not connected</div>
                <div id="collaboratorsList">
                    <strong>Collaborators:</strong>
                    <div id="collaborators">None</div>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col">
            <div class="container">
                <label for="documentContent">Document Content:</label>
                <div class="cursor-position" id="cursorInfo">Cursor: position 0</div>
                <textarea id="documentContent" placeholder="Start typing to collaborate..."></textarea>

                <div class="action-buttons">
                    <button onclick="addText()" disabled id="addTextBtn">Add Text</button>
                    <button onclick="removeText()" disabled id="removeTextBtn">Remove Text</button>
                    <button onclick="selectText()" disabled id="selectTextBtn">Select Text</button>
                    <button onclick="deselectText()" disabled id="deselectTextBtn">Deselect Text</button>
                </div>

                <div class="container">
                    <label>Text Operations:</label>
                    <div class="row">
                        <div class="col">
                            <input type="number" id="textPosition" placeholder="Position" value="0">
                        </div>
                        <div class="col">
                            <input type="text" id="textToAdd" placeholder="Text to add" value="Hello ">
                        </div>
                        <div class="col">
                            <input type="number" id="textLength" placeholder="Length" value="5">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col">
            <div class="container">
                <label>Messages Log:</label>
                <div id="messages" class="messages"></div>
                <button onclick="clearMessages()" class="secondary">Clear Messages</button>
            </div>
        </div>
    </div>

    <script>
        let stompClient = null;
        let isConnected = false;
        let currentDocumentId = null;
        let localSessionState = null;
        let myUserId = null;
        let myCollaboratorId = null;
        let subscriptionToUpdates = null;
        let subscriptionToCollaborativeSessionState = null;
        let myCursorPosition = null;
        let sequenceNumber = 0;

        // Utility functions
        function addMessage(message, type = 'info') {
            const messages = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            const timestamp = new Date().toLocaleTimeString();
            messageDiv.innerHTML = `<span style="color: #666">${timestamp}</span> [${type.toUpperCase()}] ${message}`;
            messages.appendChild(messageDiv);
            messages.scrollTop = messages.scrollHeight;
        }

        function clearMessages() {
            document.getElementById('messages').innerHTML = '';
        }

        function updateUI() {
            const connected = isConnected;
            const joined = connected && localSessionState !== null;

            document.getElementById('connectBtn').disabled = connected;
            document.getElementById('disconnectBtn').disabled = !connected;
            document.getElementById('joinBtn').disabled = !connected || joined;

            document.getElementById('addTextBtn').disabled = !joined;
            document.getElementById('removeTextBtn').disabled = !joined;
            document.getElementById('selectTextBtn').disabled = !joined;
            document.getElementById('deselectTextBtn').disabled = !joined;

            const status = document.getElementById('status');
            if (connected) {
                status.textContent = joined ? `Connected and joined to ${currentDocumentId}` : 'Connected';
                status.className = 'status connected';
            } else {
                status.textContent = 'Disconnected';
                status.className = 'status disconnected';
            }

            updateSessionInfo();
            updateCollaboratorsList();
        }

        function updateSessionInfo() {
            const info = document.getElementById('sessionInfo');
            if (localSessionState) {
                info.innerHTML = `
                    <div><strong>Session ID:</strong> ${localSessionState.id}</div>
                    <div><strong>Document ID:</strong> ${currentDocumentId}</div>
                    <div><strong>Document Length:</strong> ${localSessionState.documentState.content.length} chars</div>
                    <div><strong>Sequence:</strong> ${localSessionState.lastCollaborativeEventSequenceNumber}</div>
                `;
            } else {
                info.textContent = isConnected ? 'Connected but not joined' : 'Not connected';
            }
        }

        function updateCollaboratorsList() {
            const collaboratorsDiv = document.getElementById('collaborators');
            if (localSessionState && localSessionState.collaboratorStates) {
                const collaborators = localSessionState.collaboratorStates;
                if (collaborators.length > 0) {
                    collaboratorsDiv.innerHTML = collaborators.map(collab => `
                        <div class="collaborator">
                            <strong>User:</strong> ${collab.userId}<br>
                            <strong>Cursor:</strong> ${collab.cursorPosition || 'N/A'}<br>
                            <strong>Selected:</strong> ${collab.selectedText ?
                                `pos ${collab.selectedText.position}, len ${collab.selectedText.length}` : 'None'}
                        </div>
                    `).join('');
                } else {
                    collaboratorsDiv.innerHTML = 'None';
                }
            } else {
                collaboratorsDiv.innerHTML = 'Not joined';
            }
        }

        function updateDocumentContent() {
            if (localSessionState && localSessionState.documentState) {
                const textarea = document.getElementById('documentContent');
                const currentCursor = textarea.selectionStart;
                textarea.value = localSessionState.documentState.content;

                // Restore cursor if possible
                if (currentCursor <= textarea.value.length) {
                    textarea.setSelectionRange(currentCursor, currentCursor);
                }
            }
        }

        // WebSocket connection management
        function connect() {
            myUserId = document.getElementById('userId').value.trim();
            if (!myUserId) {
                alert('Please enter a User ID');
                return;
            }

            stompClient = new StompJs.Client({
                brokerURL: 'ws://localhost:8080/collaborative-session',
                connectHeaders: {
                    'UserId': myUserId
                },
                onConnect: function (frame) {
                    isConnected = true;
                    addMessage('Connected to server: ' + frame, 'success');
                    updateUI();
                },
                onStompError: function (frame) {
                    isConnected = false;
                    addMessage('Connection error: ' + frame.headers['message'], 'error');
                    updateUI();
                },
                onWebSocketError: function (error) {
                    isConnected = false;
                    addMessage('WebSocket error: ' + error, 'error');
                    updateUI();
                }
            });

            stompClient.activate();
        }

        function disconnect() {
            if (stompClient !== null) {
                if (subscriptionToUpdates) {
                    subscriptionToUpdates.unsubscribe();
                    subscriptionToUpdates = null;
                }
                if (subscriptionToCollaborativeSessionState) {
                    subscriptionToCollaborativeSessionState.unsubscribe();
                    subscriptionToCollaborativeSessionState = null;
                }
                stompClient.deactivate();
            }
            isConnected = false;
            currentDocumentId = null;
            localSessionState = null;
            addMessage('Disconnected from server', 'info');
            updateUI();
        }

        function joinDocument(options) {
            const docId = document.getElementById('documentId').value.trim();
            if (!stompClient || !docId) {
                alert('Please connect first and enter a document ID');
                return;
            }

            currentDocumentId = docId;

            // Subscribe to updates for this document
            subscriptionToUpdates = stompClient.subscribe('/topic/updates/' + docId, function (message) {
                console.log(`Time: ${(new Date(Date.now())).toISOString()}. (/topic/updates/${docId}) Message received: ${message.body}`);
            });

            // Subscribe to collaborative session state
            subscriptionToCollaborativeSessionState = stompClient.subscribe(`/user/${myUserId}/queue/collaborative-session-state/${docId}`, function (message) {
                console.log(`Time: ${(new Date(Date.now())).toISOString()}. (/user/${myUserId}/queue/collaborative-session-state/${docId}) Message received: ${message.body}`);
                localSessionState = JSON.parse(message.body);
                let myCollaboratorState = localSessionState.collaboratorStates.find((collaboratorState) => (collaboratorState.userId === myUserId))
                if (myCollaboratorState) {
                    myCollaboratorId = myCollaboratorState.collaboratorId;
                }
                addMessage('Received session state update', 'success');
                updateDocumentContent();
                updateUI();
            });

            stompClient.publish({
                destination: '/app/join-session/' + docId,
                body: JSON.stringify({})
            })

            addMessage('Joined document: ' + docId, 'success');
            updateUI();
        }

        // Document operations
        function addText() {
            if (!stompClient || !localSessionState) return;

            const position = parseInt(document.getElementById('textPosition').value) || 0;
            const text = document.getElementById('textToAdd').value || 'Hello ';

            const request = {
                collaborativeSessionId: localSessionState.id,
                collaboratorId: myCollaboratorId,
                position: position,
                text: text,
                sequenceNumber: sequenceNumber++
            };

            stompClient.publish({
                destination: '/app/add-text',
                body: JSON.stringify(request)
            })
            console.log(`Time: ${(new Date(Date.now())).toISOString()}`,'(Func) Sent add-text: ' + request);
            addMessage(`Sent add-text: "${text}" at position ${position} (seq: ${request.sequenceNumber})`, 'action');
        }

        function removeText() {
            if (!stompClient || !localSessionState) return;

            const position = parseInt(document.getElementById('textPosition').value) || 0;
            const length = parseInt(document.getElementById('textLength').value) || 1;

            const request = {
                collaborativeSessionId: localSessionState.id,
                collaboratorId: myCollaboratorId,
                position: position,
                length: length,
                sequenceNumber: sequenceNumber++
            };

            stompClient.publish({
                destination: '/app/remove-text',
                body: JSON.stringify(request)
            })
            addMessage(`Sent remove-text: ${length} chars from position ${position} (seq: ${request.sequenceNumber})`, 'action');
        }

        function selectText() {
            if (!stompClient || !localSessionState) return;

            const position = parseInt(document.getElementById('textPosition').value) || 0;
            const length = parseInt(document.getElementById('textLength').value) || 1;

            const request = {
                collaborativeSessionId: localSessionState.id,
                collaboratorId: myCollaboratorId,
                position: position,
                length: length,
                sequenceNumber: sequenceNumber++
            };

            stompClient.publish({
                destination: '/app/select-text',
                body: JSON.stringify(request)
            })
            addMessage(`Sent select-text: ${length} chars from position ${position} (seq: ${request.sequenceNumber})`, 'action');
        }

        function deselectText() {
            if (!stompClient || !localSessionState) return;

            const request = {
                collaborativeSessionId: localSessionState.id,
                collaboratorId: myCollaboratorId,
                sequenceNumber: sequenceNumber++
            };

            stompClient.publish({
                destination: '/app/deselect-text',
                body: JSON.stringify(request)
            })
            addMessage(`Sent deselect-text (seq: ${request.sequenceNumber})`, 'action');
        }

        // Cursor position tracking
        function updateCursorPosition() {
            if (!stompClient || !localSessionState) return;

            const textarea = document.getElementById('documentContent');
            const newPosition = textarea.selectionStart;
            if(myCursorPosition === newPosition) return;

            document.getElementById('cursorInfo').textContent = `Cursor: position ${newPosition}`;

            const request = {
                collaborativeSessionId: localSessionState.id,
                collaboratorId: myCollaboratorId,
                newPosition: newPosition,
                sequenceNumber: sequenceNumber++
            };

            stompClient.publish({
                destination: '/app/change-cursor-position',
                body: JSON.stringify(request)
            })
            console.log(`Time: ${(new Date(Date.now())).toISOString()}`,'Sent change-cursor-position: ' + newPosition + ` (seq: ${request.sequenceNumber})`);
            myCursorPosition = newPosition;
        }

        // Event listeners
/*        document.getElementById('documentContent').addEventListener('input', function() {
            updateCursorPosition();
        });*/

/*        document.getElementById('documentContent').addEventListener('selectionchange', function() {
            updateCursorPosition();
        });*/

        document.getElementById('documentContent').addEventListener('click', function() {
            updateCursorPosition();
        });

/*        document.getElementById('documentContent').addEventListener('keyup', function() {
            updateCursorPosition();
        });*/

        // Auto-detect text operations from textarea
        let lastContent = '';
        document.getElementById('documentContent').addEventListener('input', function(e) {
            if (!localSessionState) return;

            const currentContent = e.target.value;
            const cursorPos = e.target.selectionStart;

            // Simple diff to detect changes
            if (currentContent.length > lastContent.length) {
                // Text was added
                const addedText = currentContent.slice(lastContent.length);
                const position = lastContent.length;

                if (addedText) {
                    const request = {
                        collaborativeSessionId: localSessionState.id,
                        collaboratorId: myCollaboratorId,
                        position: position,
                        text: addedText,
                        sequenceNumber: sequenceNumber++
                    };

                    stompClient.publish({
                        destination: '/app/add-text',
                        body: JSON.stringify(request)
                    })
                    console.log(`Time: ${(new Date(Date.now())).toISOString()}`,'Sent add-text: ' + request);
                    addMessage(`Auto-sent add-text: "${addedText}" at position ${position} (seq: ${request.sequenceNumber})`, 'auto');
                    updateCursorPosition();
                }
            } else if (currentContent.length < lastContent.length) {
                // Text was removed
                const removedLength = lastContent.length - currentContent.length;
                const position = cursorPos;

                const request = {
                    collaborativeSessionId: localSessionState.id,
                    collaboratorId: myCollaboratorId,
                    position: position,
                    length: removedLength,
                    sequenceNumber: sequenceNumber++
                };

                stompClient.publish({
                    destination: '/app/remove-text',
                    body: JSON.stringify(request)
                })
                addMessage(`Auto-sent remove-text: ${removedLength} chars from position ${position} (seq: ${request.sequenceNumber})`, 'auto');
                updateCursorPosition();
            }

            lastContent = currentContent;
        });

        // Initialize
        updateUI();
        addMessage('Application initialized. Enter User ID and Document ID, then connect.', 'info');
    </script>
</body>
</html>
