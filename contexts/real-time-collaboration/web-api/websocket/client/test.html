<!DOCTYPE html>
<html>
<head>
    <title>Document Editor</title>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.2.0/bundles/stomp.umd.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            margin-bottom: 20px;
        }
        .row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .col {
            flex: 1;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, textarea, select {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        textarea {
            height: 400px;
            font-family: monospace;
            resize: vertical;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        button.secondary {
            background-color: #6c757d;
        }
        button.danger {
            background-color: #dc3545;
        }
        .status {
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .status.connected {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.disconnected {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .panel {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #dee2e6;
            margin-bottom: 15px;
        }
        .writer {
            padding: 5px;
            margin: 2px 0;
            background-color: #e9ecef;
            border-radius: 3px;
            font-size: 12px;
        }
        .messages {
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
            border: 1px solid #dee2e6;
        }
        .session-info {
            font-size: 12px;
            color: #6c757d;
        }
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 10px;
        }
        .cursor-position {
            background-color: #fff3cd;
            padding: 5px;
            border-radius: 3px;
            font-size: 12px;
            margin-bottom: 5px;
        }
        .events {
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
            border: 1px solid #dee2e6;
        }
        .event-item {
            padding: 5px;
            margin: 2px 0;
            border-left: 3px solid #007bff;
            background-color: #e7f1ff;
            border-radius: 3px;
        }
        .event-timestamp {
            color: #666;
            font-size: 10px;
        }
    </style>
</head>
<body>
    <h1>Document Editor</h1>

    <div id="status" class="status disconnected">Disconnected</div>

    <div class="row">
        <div class="col">
            <div class="container">
                <label for="userId">User ID:</label>
                <input type="text" id="userId" value="0fc5d24f-90ac-47df-8fe1-b3477d82e709">
            </div>

            <div class="container">
                <label for="documentId">Document ID:</label>
                <input type="text" id="documentId" value="ed973e41-d119-4eb4-8207-bca742bbcc43">
            </div>

            <div class="container">
                <button id="connectBtn" onclick="connect()">Connect</button>
                <button id="disconnectBtn" onclick="disconnect()" disabled>Disconnect</button>
                <button id="joinBtn" onclick="joinDocument()" disabled>Join Document</button>
            </div>
        </div>

        <div class="col">
            <div class="panel">
                <h4>Session State</h4>
                <div id="sessionInfo" class="session-info">Not connected</div>
                <div id="writersList">
                    <strong>Writers:</strong>
                    <div id="writers">None</div>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col">
            <div class="container">
                <label for="documentContent">Document Content:</label>
                <div class="cursor-position" id="cursorInfo">Cursor: position 0</div>
                <textarea id="documentContent" placeholder="Start typing to collaborate..."></textarea>

            </div>
        </div>

        <div class="col">
            <div class="container">
                <label>Messages Log:</label>
                <div id="messages" class="messages"></div>
                <button onclick="clearMessages()" class="secondary">Clear Messages</button>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col">
            <div class="container">
                <label>Session Events:</label>
                <div id="eventsContainer" class="events"></div>
                <button onclick="clearEvents()" class="secondary">Clear Events</button>
            </div>
        </div>
    </div>

    <script type="module" src="session-events.js"></script>
</body>
</html>
